<div class="Pagina">
  <div class="Contenido" id="ContAgendar">
    <div class="AgendarIzq">
      <div class="TitContenido">Gestionar Horarios</div>
      <div id="ImgAgendar">
        <img src="Imagenes/Consultorio.jpg" alt="Consultorio">
      </div>
    </div>

    <div class="AgendarDer">
      <form (ngSubmit)="onSubmit()">
        <div class="TitOpcion">Fecha:</div>
        <div class="Opciones">
          <div class="TipoOpcion">Selecciona una fecha</div>
          <div class="BotonOpcion">
            <input type="date" [formControl]="horarioForm.controls.fecha">
          </div>
        </div>

        <div class="TitOpcion">Hora de Inicio:</div>
        <div class="Opciones">
          <div class="TipoOpcion">Hora inicial</div>
          <div class="BotonOpcion">
            <input type="time" [formControl]="horarioForm.controls.hora_inicio" step="3600">
          </div>
        </div>

        <div class="TitOpcion">Hora de Fin:</div>
        <div class="Opciones">
          <div class="TipoOpcion">Hora final</div>
          <div class="BotonOpcion">
            <input type="time" [formControl]="horarioForm.controls.hora_fin" step="3600">
          </div>
        </div>

        <br>
        <button type="submit" class="BotonCita" [disabled]="horarioForm.invalid || horariosService.isLoading()">
          @if (horariosService.isLoading()) {
            Guardando...
          } @else {
            Agregar Horario
          }
        </button>
      </form>

      @if (horariosService.successMessage()) {
        <div class="MensajeExito">
          {{ horariosService.successMessage() }}
        </div>
      }

      @if (horariosService.errorMessage()) {
        <div class="MensajeError">
          {{ horariosService.errorMessage() }}
        </div>
      }
    </div>
  </div>
</div>
