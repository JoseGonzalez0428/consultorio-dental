<div class="Pagina">
  <div class="Contenido" id="ContAgendar">
    <div class="AgendarIzq">
      <div class="TitContenido">Crear nuevo reporte</div>
      <div id="ImgAgendar">
        <img src="Imagenes/reportes-medicos.jpg" alt="Reportes">
      </div>
    </div>

    <div class="AgendarDer">
      <form (ngSubmit)="onSubmit()">
        <div class="TitOpcion">Selecciona la fecha (solo citas pasadas):</div>
        <div class="Opciones">
          <div class="TipoOpcion">Fecha</div>
          <div class="BotonOpcion">
            <input type="date" [formControl]="reporteForm.controls.fecha"
              [max]="ayer"
              (change)="cargarCitas()">
          </div>
        </div>

        <div class="TitOpcion">Citas disponibles:</div>
        <div class="Opciones">
          <div class="TipoOpcion">Cita</div>
          <div class="BotonOpcion">
            <select [formControl]="reporteForm.controls.id_cita">
              <option value="">Selecciona una cita</option>
              @for (cita of reportesService.citasPasadas(); track cita._id) {
                <option [value]="cita._id">
                  {{ cita.hora }} - {{ cita.nombre_paciente }} - {{ cita.nombre_tratamiento }}
                </option>
              }
            </select>
          </div>
        </div>

        <div class="TitOpcion">Notas:</div>
        <div class="Opciones">
          <textarea [formControl]="reporteForm.controls.notas" rows="6"></textarea>
        </div>

        <br>
        <button type="submit" class="BotonCita"
          [disabled]="reporteForm.invalid || reportesService.isLoading()">
          @if (reportesService.isLoading()) {
            Guardando...
          } @else {
            Crear reporte
          }
        </button>
      </form>

      @if (reportesService.successMessage()) {
        <div class="MensajeExito">
          {{ reportesService.successMessage() }}
        </div>
      }

      @if (reportesService.errorMessage()) {
        <div class="MensajeError">
          {{ reportesService.errorMessage() }}
        </div>
      }
    </div>
  </div>
</div>
