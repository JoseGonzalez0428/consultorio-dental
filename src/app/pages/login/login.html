<div class="login-page">
  <main class="login-container">
    <div class="login-card">
      
      <div class="login-header">
        <img src="Imagenes/logo.png" alt="Odontología Integral Flores" class="logo-img">
        <h1>Bienvenido de nuevo</h1>
        <p>Por favor, introduce tus credenciales para acceder</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            id="email" 
            type="email" 
            formControlName="correo" 
            placeholder="ejemplo@correo.com"
            [class.input-error]="loginForm.get('correo')?.touched && loginForm.get('correo')?.invalid">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            id="password" 
            type="password" 
            formControlName="contrasena" 
            placeholder="••••••••"
            [class.input-error]="loginForm.get('contrasena')?.touched && loginForm.get('contrasena')?.invalid">
        </div>

        <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || authService.isLoading()">
          @if (authService.isLoading()) {
            <span class="pulse">Cargando...</span>
          } @else {
            <span>Iniciar Sesión</span>
          }
        </button>

        @if (authService.errorMessage()) {
          <div class="error-box">
            {{ authService.errorMessage() }}
          </div>
        }
      </form>

      <div class="register-redirect">
        <span>¿No tienes cuenta?</span>
        <a routerLink="/registro">Regístrate aquí</a>
      </div>

    </div>
  </main>
</div>
