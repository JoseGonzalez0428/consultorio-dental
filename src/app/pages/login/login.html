<div class="Pagina">
  <div id="MenuDeLogin"></div>
  <div class="Contenido">
    <div id="LogoLogin"><img src="Imagenes/logo.png" alt="Logo"></div>

    <div class="CuadroLogin">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="TitLogin">Email</div>
        <div class="Campo"><input type="email" formControlName="correo" placeholder="ejemplo@correo.com"></div>

        <div class="TitLogin">Contraseña</div>
        <div class="Campo CampoPassword">
          <input [type]="mostrarContrasena ? 'text' : 'password'" formControlName="contrasena">
          <button type="button" class="BtnOjito" (click)="toggleContrasena()">
            @if (mostrarContrasena) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>

        <div id="BotonRegistrar">
          <button type="submit" [disabled]="loginForm.invalid || authService.isLoading()">
            @if (authService.isLoading()) { Cargando... } @else { Iniciar Sesión }
          </button>
        </div>

        @if (authService.errorMessage()) {
          <div class="MensajeError">{{ authService.errorMessage() }}</div>
        }
      </form>

      <div id="Pregunta">¿No tienes cuenta?</div>
      <div id="IniciaSesion"><a routerLink="/registro">Regístrate aquí</a></div>
    </div>
  </div>
  <div id="PieDeLogin"></div>
</div>
