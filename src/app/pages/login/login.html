<div class="Pagina">
  <div id="MenuDeLogin"></div>
  <div class="Contenido">
    <div id="LogoLogin"><img src="Imagenes/logo.png" alt="Logo"></div>

    <div class="CuadroLogin">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="TitLogin">Email</div>
        <div class="Campo"><input type="email" formControlName="correo" placeholder="ejemplo@correo.com"></div>

        <div class="TitLogin">Contraseña</div>
        <div class="Campo"><input type="password" formControlName="contrasena" placeholder="••••••••"></div>

        <div id="BotonRegistrar">
          <button type="submit" [disabled]="loginForm.invalid || authService.isLoading()">
            @if (authService.isLoading()) { Cargando... } @else { Iniciar Sesión }
          </button>
        </div>

        @if (authService.errorMessage()) {
          <div class="MensajeError">{{ authService.errorMessage() }}</div>
        }
      </form>

      <div id="Pregunta">¿No tienes cuenta?</div>
      <div id="IniciaSesion"><a routerLink="/registro">Regístrate aquí</a></div>
    </div>
  </div>
  <div id="PieDeLogin"></div>
</div>
