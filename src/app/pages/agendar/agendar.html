<div class="Pagina">
  <div class="Contenido" id="ContAgendar">
    <div class="AgendarIzq">
      <div class="TitContenido">Agendar una cita</div>
      <div id="ImgAgendar">
        <img src="Imagenes/Consultorio.jpg" alt="Consultorio">
      </div>
    </div>

    <div class="AgendarDer">
      <!-- Tratamiento -->
      <div class="TitOpcion">Tratamiento:</div>
      <div class="Opciones">
        <div class="TipoOpcion">Tipo de tratamiento</div>
        <div class="BotonOpcion">
          <select [(ngModel)]="idTratamientoSeleccionado" required>
            <option value="">Seleccione...</option>
            @for (t of tratamientos; track t.id) {
              <option [value]="t.id">{{ t.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Fecha -->
      <div class="TitOpcion">Fecha:</div>
      <div class="Opciones">
        <div class="TipoOpcion">Seleccione una fecha</div>
        <div class="BotonOpcion">
          <select [(ngModel)]="fechaSeleccionada" (ngModelChange)="cargarHoras($event)" required>
            <option value="">Seleccione...</option>
            @for (f of fechasDisponibles; track f) {
              <option [value]="f">{{ formatearFecha(f) }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Hora -->
      <div class="TitOpcion">Hora:</div>
      <div class="Opciones">
        <div class="TipoOpcion">Seleccione una hora</div>
        <div class="BotonOpcion">
          <select [(ngModel)]="horaSeleccionada" [disabled]="!fechaSeleccionada" required>
            <option value="">Seleccione una fecha primero</option>
            @for (h of horasDisponibles; track h.inicio) {
              <option [value]="h.inicio">{{ h.inicio }} - {{ h.fin }}</option>
            }
          </select>
        </div>
      </div>

      <br>
      <button class="BotonCita" (click)="confirmarCita()">Confirmar cita</button>

      @if (mensaje) {
        <p style="margin-top: 20px; font-family: Verdana; font-weight: bold;">
          {{ mensaje }}
        </p>
      }
    </div>
  </div>
</div>
