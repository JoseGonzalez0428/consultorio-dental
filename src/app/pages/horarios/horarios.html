<div class="schedule-page">
  <main class="schedule-container">
    <h1 class="schedule-title">Horarios Disponibles</h1>
    
    <app-calendario
        [dias]="diasConBadge()"
        [vacios]="horariosService.vacios()"
        [nombreMes]="horariosService.nombreMes()"
        [anioActual]="horariosService.anioActual()"
        (anteriorClic)="horariosService.mesAnterior()"
        (siguienteClic)="horariosService.mesSiguiente()"
        (diaClic)="irAgendar($event.fecha)">
      </app-calendario>
    </main>
</div>
