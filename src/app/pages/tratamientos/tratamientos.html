<div class="Pagina">
  <div class="Contenido">
    <h2 class="TitContenido" style="text-align: center;">Nuestros tratamientos</h2>

    <div class="lista-tratamientos">
      @for (tratamiento of tratamientos; track tratamiento.id) {
        <div class="tratamiento-carta" (click)="verTratamiento(tratamiento.id)">
          <img [src]="'Imagenes/' + tratamiento.imagen" [alt]="tratamiento.nombre">
          <div>{{ tratamiento.nombre }}</div>
        </div>
      }
    </div>
  </div>
</div>
